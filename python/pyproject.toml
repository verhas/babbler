[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "javax0-babbler"
version = "1.0.0"
description = "Convert a counter into a pronounceable, human-friendly identifier"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Peter Verhas" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
babbler = "babbler.cli:main"

[tool.setuptools.packages.find]
include = ["babbler*"]
